name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  # ------------------------------------------------------------------ #
  # Linux — amd64 and arm64                                            #
  # ------------------------------------------------------------------ #
  build-and-test-linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang clang-tidy cppcheck valgrind libtls-dev

      - name: Install h2spec
        if: matrix.arch == 'amd64'
        run: |
          curl -fsSL https://github.com/summerwind/h2spec/releases/latest/download/h2spec_linux_amd64.tar.gz \
            | tar -xz
          chmod +x h2spec
          sudo mv h2spec /usr/local/bin/h2spec

      - name: Build (dev)
        run: make dev

      - name: Lint
        run: make lint

      - name: Test (ASan/UBSan)
        run: make test

      - name: Test (TSan)
        run: make test-tsan

      - name: Test (Valgrind)
        run: make valgrind

      - name: Conformance (h2spec)
        if: matrix.arch == 'amd64'
        run: |
          set -eu
          make h2spec-server
          ./tests/h2spec_server --port 8443 > h2spec_server.log 2>&1 &
          H2SPEC_SERVER_PID=$!
          trap 'kill "$H2SPEC_SERVER_PID" 2>/dev/null || true; wait "$H2SPEC_SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1

          set +e
          h2spec -h 127.0.0.1 -p 8443 --tls --insecure | tee h2spec.log
          H2SPEC_RC=${PIPESTATUS[0]}
          set -e

          if [ "$H2SPEC_RC" -ne 0 ]; then
            echo "h2spec returned non-zero exit code: $H2SPEC_RC"
            exit "$H2SPEC_RC"
          fi

          # Current expected outcome: no failures and one skipped case.
          # Skipped case ID: HTTP/2 6.9.2/2
          #   "Sends a SETTINGS frame for window size to be negative"
          if ! grep -Eq '[0-9]+ tests, [0-9]+ passed, 1 skipped, 0 failed' h2spec.log; then
            echo "Unexpected h2spec summary (expected: 0 failed, 1 skipped)."
            tail -n 50 h2spec.log
            exit 1
          fi

  # ------------------------------------------------------------------ #
  # OpenBSD amd64                                                       #
  # ------------------------------------------------------------------ #
  build-and-test-openbsd-amd64:
    name: OpenBSD amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test in OpenBSD
        uses: vmactions/openbsd-vm@v1.3.8
        with:
          usesh: true
          run: |
            make dev
            make test || {
              echo "make test failed; collecting backtrace from build/tests/run_tests"
              if ! command -v gdb >/dev/null 2>&1; then
                pkg_add -I gdb || doas pkg_add -I gdb || true
              fi
              if command -v gdb >/dev/null 2>&1; then
                gdb -q -batch \
                  -ex run \
                  -ex "thread apply all bt full" \
                  -ex "info registers" \
                  -ex "x/16i \$pc" \
                  --args build/tests/run_tests || true
              elif command -v lldb >/dev/null 2>&1; then
                printf '%s\n' \
                  'settings set interpreter.stop-command-source-on-error false' \
                  'run' \
                  'thread backtrace all' \
                  'register read' \
                  'disassemble --frame' \
                  'memory read --format x --size 8 --count 16 $sp' \
                  'quit' > /tmp/lldb_cmds.txt
                lldb -b -s /tmp/lldb_cmds.txt -- build/tests/run_tests || true
              fi
              exit 1
            }

  # ------------------------------------------------------------------ #
  # OpenBSD arm64                                                       #
  # ------------------------------------------------------------------ #
  build-and-test-openbsd-arm64:
    name: OpenBSD arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test in OpenBSD
        uses: vmactions/openbsd-vm@v1.3.8
        with:
          usesh: true
          arch: aarch64
          run: |
            make dev
            make test || {
              echo "make test failed; collecting backtrace from build/tests/run_tests"
              if ! command -v gdb >/dev/null 2>&1; then
                pkg_add -I gdb || doas pkg_add -I gdb || true
              fi
              if command -v gdb >/dev/null 2>&1; then
                gdb -q -batch \
                  -ex run \
                  -ex "thread apply all bt full" \
                  -ex "info registers" \
                  -ex "x/16i \$pc" \
                  --args build/tests/run_tests || true
              elif command -v lldb >/dev/null 2>&1; then
                printf '%s\n' \
                  'settings set interpreter.stop-command-source-on-error false' \
                  'run' \
                  'thread backtrace all' \
                  'register read' \
                  'disassemble --frame' \
                  'memory read --format x --size 8 --count 16 $sp' \
                  'quit' > /tmp/lldb_cmds.txt
                lldb -b -s /tmp/lldb_cmds.txt -- build/tests/run_tests || true
              fi
              exit 1
            }

